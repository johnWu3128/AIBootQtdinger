# Podman Compose compatibility override.
# podman-compose 1.5.0 does not fully expand nested defaults such as
# ${FRONTEND_TAG:-${IMAGE_TAG:-latest}}, so keep the frontend image explicit.
services:
  frontend:
    image: ghcr.io/brokermr810/quantdinger-frontend:latest
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:5000}
      - NO_PROXY=localhost,127.0.0.1,::1,backend
      - no_proxy=localhost,127.0.0.1,::1,backend
  backend:
    environment:
      - NO_PROXY=localhost,127.0.0.1,::1,postgres,redis
      - no_proxy=localhost,127.0.0.1,::1,postgres,redis
      - LLM_PROVIDER=custom
      - CUSTOM_API_URL=https://api.mozen.app/v1
      - CUSTOM_API_KEY=sk-mozen-d9642f4c4ed44921bbe924c4b3574b0c
      - CUSTOM_MODEL=claude-opus-4-8
      - AI_CODE_GEN_MODEL=claude-opus-4-8
      - PROXY_URL=
      - HTTP_PROXY=http://172.19.160.1:7897
      - HTTPS_PROXY=http://172.19.160.1:7897
      - NO_PROXY=localhost,127.0.0.1,::1,postgres,redis,api.mozen.app,api.binance.me
      - CCXT_DEFAULT_EXCHANGE=okx
