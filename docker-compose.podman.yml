# Podman Compose compatibility override.
# podman-compose 1.5.0 does not fully expand nested defaults such as
# ${FRONTEND_TAG:-${IMAGE_TAG:-latest}}, so keep the frontend image explicit.
services:
  frontend:
    image: ghcr.io/brokermr810/quantdinger-frontend:latest
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:5000}
      - NO_PROXY=localhost,127.0.0.1,::1,backend
      - no_proxy=localhost,127.0.0.1,::1,backend
  backend:
    environment:
      - NO_PROXY=localhost,127.0.0.1,::1,postgres,redis
      - no_proxy=localhost,127.0.0.1,::1,postgres,redis
